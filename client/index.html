<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- A pagina e em portugues. Sem o `lang` correto o Chrome a detectava como
         ingles e oferecia/aplicava traducao automatica; o tradutor troca os nos
         de texto do DOM por <font>, o React perde a referencia e a tela quebra
         com "removeChild: node is not a child of this node". O notranslate
         desliga a traducao tambem para quem tem "traduzir sempre" ligado. -->
    <meta name="google" content="notranslate" />
    <!-- Fontes da tela inicial (tailwind: font-display / font-body). Com
         display=swap o texto aparece na fonte de fallback enquanto carrega. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Reservas FGV</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
